overrides:
  zod: ">=3.25"

# Store y cache: se usan las rutas por defecto de pnpm ($XDG_DATA_HOME/pnpm/store
# y $XDG_CACHE_HOME/pnpm), que ya quedan fuera del repositorio. No fijar rutas
# absolutas aca: storeDir/cacheDir apuntaban a /opt/pnpm-* y /opt no es
# escribible por el usuario de desarrollo, asi que el install fallaba con EACCES.
# En el servidor, definir XDG_DATA_HOME/XDG_CACHE_HOME en el entorno del servicio
# en lugar de hardcodear rutas en este archivo.

# Directorios de agent skills donde pnpm enlaza las skills que publican las
# dependencias (dotenv). Sin esto, `pnpm install` falla con
# ERR_PNPM_NO_AGENT_SKILLS_DIR cuando no detecta un agente por variables de
# entorno (CLAUDE_CODE, CURSOR_AGENT, AI_AGENT, ...).
skills:
  dirs:
    - .claude/skills

# `pnpm exec` / `pnpm run` no deben disparar un `pnpm install` implicito.
# En despliegue el servicio corre con NODE_ENV=production, y ese install
# implicito podaria las devDependencies (prisma, tsx, typescript), rompiendo
# `prisma migrate deploy` y el build. Las dependencias se instalan de forma
# explicita y separada. Nota: el .env del repositorio ya NO define NODE_ENV.
verifyDepsBeforeRun: false

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  msw: true
  prisma: true
  sharp: true
  unrs-resolver: true
shamefullyHoist: true
permissions:
  dotenv:
    skills: true
